name: Install Scapy

on:
  workflow_dispatch:

jobs:
  install-scapy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scapy
        run: |
          python -m pip install --upgrade pip
          pip install scapy

      - name: Test Scapy
        run: |
          python -c "import scapy; print('Scapy installed successfully!')"
